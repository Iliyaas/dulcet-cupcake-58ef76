<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart School Timetable Generator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg: #0f1420; --bg2: #161d2d; --card: #1b2434; --line: #2a3548;
--txt: #e8eefc; --mut: #93a1bb; --acc: #3d8bfd; --acc2: #1f6feb;
--ok: #2ecc8f; --warn: #f0a92b; --bad: #ff5c6c;}
*{box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin: 0; padding: 0; height: 100%;}
body{background: #0f1420; color: var(--txt); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.45; overflow-x: hidden;}
#app{display: flex; min-height: 100vh;}
#side{width: 234px; flex: 0 0 234px; background: var(--bg2); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto;}
.brand{display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px 8px;}
.logo{width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #3d8bfd, #7b5cff); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: 0 0 38px;}
.brand b{display: block; font-size: 14px;}
.brand small{display: block; color: var(--mut); font-size: 11px;}
.navi{display: flex; flex-direction: column; gap: 3px;}
.navi a{display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 10px; color: var(--mut); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer;}
.navi a:hover{background: #202a3d; color: var(--txt);}
.navi a.on{background: linear-gradient(90deg, #22406e, #1d3054); color: #fff; box-shadow: inset 0 0 0 1px #2f5590;}
.navi a .badge{margin-left: auto; background: var(--bad); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 20px; font-weight: 700;}
#main{flex: 1; min-width: 0; padding: 18px 22px 90px 22px;}
.topline{display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px;}
.topline h1{font-size: 20px; margin: 0; font-weight: 650;}
.topline .sub{color: var(--mut); font-size: 13px;}
.spacer{flex: 1;}
.card{background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px;}
.card h2{font-size: 15px; margin: 0 0 12px 0; font-weight: 650;}
.card h2 span{color: var(--mut); font-weight: 400; font-size: 12px; margin-left: 6px;}
.kpis{display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-bottom: 16px;}
.kpi{background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;}
.kpi .v{font-size: 25px; font-weight: 700;}
.kpi .l{color: var(--mut); font-size: 12px; margin-top: 2px;}
.kpi.bad .v{color: var(--bad);} .kpi.ok .v{color: var(--ok);}
button{font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: #243149; color: var(--txt); cursor: pointer; display: inline-flex; align-items: center; gap: 7px;}
button:hover{background: #2c3b58;}
button.primary{background: linear-gradient(135deg, #3d8bfd, #2f6fe0); border-color: #3d8bfd; color: #fff;}
button.ghost{background: transparent;}
button.bad{background: #3a2028; border-color: #5c2b36; color: #ff8b96;}
button.sm{padding: 5px 10px; font-size: 12.5px; border-radius: 8px;}
button:disabled{opacity: .5; cursor: not-allowed;}
input,select,textarea{font-family: inherit; font-size: 14px; background: #131a29; color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; outline: none;}
input:focus,select:focus,textarea:focus{border-color: var(--acc);}
label.f{display: block; margin-bottom: 11px;}
label.f>span{display: block; font-size: 12px; color: var(--mut); margin-bottom: 5px; font-weight: 600;}
.row{display: grid; grid-template-columns: 1fr 1fr; gap: 12px;}
.row3{display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;}
table{width: 100%; border-collapse: collapse; font-size: 13.5px;}
th{text-align: left; color: var(--mut); font-size: 11.5px; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); font-weight: 700;}
td{padding: 9px 10px; border-bottom: 1px solid #212b3d; vertical-align: middle;}
tr:last-child td{border-bottom: none;}
tbody tr:hover{background: #1f2839;}
.tblwrap{overflow-x: auto;}
.pill{display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; background: #243044; color: #9fb0cc;}
.pill.owner{background: #3a2f14; color: #f0c04b;}
.pill.admin{background: #16304f; color: #69a8ff;}
.pill.ok{background: #12362a; color: #4fe0a8;}
.pill.bad{background: #3a1f26; color: #ff8b96;}
.muted{color: var(--mut);}
.empty{color: var(--mut); text-align: center; padding: 26px 10px; font-size: 13.5px;}
#modal{position: fixed; inset: 0; background: rgba(6,9,16,.74); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 80;}
#modal.on{display: flex;}
.sheet{background: var(--card); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 540px; max-height: 88vh; overflow-y: auto; padding: 18px;}
.sheet h3{margin: 0 0 14px 0; font-size: 16px;}
.sheet .acts{display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap;}
#toast{position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(140%); background: #22303f; border: 1px solid var(--line); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13.5px; z-index: 120; max-width: 92vw;}
#toast.on{transform: translateX(-50%) translateY(0);}
#toast.err{background: #43202a; border-color: #6b2b38;}
#toast.ok{background: #14382c; border-color: #215f48;}
#login{min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px; display: none;}
#login .box{width: 100%; max-width: 400px;}
#login .logo{margin: 0 auto 14px auto;}
#login h1{text-align: center; font-size: 21px; margin: 0 0 4px 0;}
#login p.sub{text-align: center; color: var(--mut); font-size: 13px; margin: 0 0 20px 0;}
.tt{width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 12.5px;}
.tt th{background: #212c40; border-radius: 8px; padding: 7px 4px; text-align: center; color: var(--mut); font-size: 11px; text-transform: none;}
.tt th.dh{text-align: left; padding-left: 9px; min-width: 74px;}
.tt td{padding: 0; border: none;}
.slot{min-height: 56px; border-radius: 9px; background: #141c2b; border: 1px dashed #2a3548; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 5px 7px; cursor: pointer;}
.slot:hover{border-color: var(--acc); background: #182233;}
.slot.full{background: #1d2c47; border: 1px solid #2f5590;}
.slot b{font-size: 12px; font-weight: 650; line-height: 1.25;}
.slot small{font-size: 10.5px; color: var(--mut); line-height: 1.3;}
.slot .plus{color: #3f4f68; font-size: 16px; text-align: center;}
.legend{display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--mut); margin-top: 10px;}
.tabs{display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px;}
.tabs button{padding: 7px 13px; font-size: 13px; border-radius: 9px; background: #1c2637;}
.tabs button.on{background: var(--acc2); border-color: var(--acc); color: #fff;}
.chip{display: inline-flex; align-items: center; gap: 6px; background: #212c40; border: 1px solid var(--line); border-radius: 20px; padding: 4px 6px 4px 11px; font-size: 12.5px; margin: 0 6px 6px 0;}
.chip span.x{cursor: pointer; color: var(--mut); padding: 0 5px; font-weight: 700;}
.chip span.x:hover{color: var(--bad);}
.cur{border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: #151d2b;}
.curline{display: grid; grid-template-columns: 1.4fr 1.2fr .9fr 70px 34px; gap: 7px; margin-bottom: 7px; align-items: center;}
.curline select,.curline input{padding: 6px 8px; font-size: 12.5px;}
.note{background: #16233a; border-left: 3px solid var(--acc); padding: 10px 13px; border-radius: 8px; font-size: 12.5px; color: #b9c7de; margin-bottom: 14px;}
.warnbox{background: #3a2f14; border-left: 3px solid var(--warn); color: #f2cf8d; padding: 10px 13px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px;}
.errbox{background: #3a1f26; border-left: 3px solid var(--bad); color: #ffb3bb; padding: 10px 13px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px;}
.chk{display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 7px; background: #151d2b;}
.chk input{width: auto;}
.hero{background: linear-gradient(135deg, #1d2c47, #1b2434); border: 1px solid #2f5590; border-radius: 16px; padding: 18px; margin-bottom: 16px;}
.hero .hi{display: flex; align-items: center; gap: 14px; flex-wrap: wrap;}
.hero h1{font-size: 20px; margin: 0 0 3px 0; font-weight: 700;}
.hero .sub{color: #b9c7de; font-size: 13px;}
.logo{overflow: hidden;}
.logo img{width: 100%; height: 100%; object-fit: cover; border-radius: inherit;}
.logo.big{width: 56px; height: 56px; flex: 0 0 56px; border-radius: 15px; font-size: 26px;}
.steps{display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px;}
.step{display: flex; align-items: center; gap: 11px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #151d2b; cursor: pointer;}
.step:hover{border-color: #2f5590;}
.step .sn{width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #243149; color: #9fb0cc;}
.step.done .sn{background: #14382c; color: #4fe0a8;}
.step b{display: block; font-size: 13.5px;}
.step small{display: block; color: var(--mut); font-size: 11.5px;}
.spinner{width: 26px; height: 26px; border: 3px solid #2a3548; border-top-color: var(--acc); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto;}
@keyframes spin{to{transform: rotate(360deg);}}
#splash{position: fixed; inset: 0; background: rgba(6,9,16,.72); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-size: 13.5px; color: #dfe8f8;}
#splash.on{display: flex;}
#mnav{display: none;}
.statline{display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;}
@media(max-width: 880px){
#app{flex-direction: column;}
#side{width: 100%; flex: none; height: auto; position: sticky; top: 0; z-index: 50; border-right: none; border-bottom: 1px solid var(--line); padding: 8px 10px; background: var(--bg2);}
.brand{padding: 0;}
.brand small{display: none;}
.navi{display: none;}
#main{padding: 12px 12px 96px 12px;}
.hero{padding: 14px;}
.hero h1{font-size: 17px;}
.logo.big{width: 46px; height: 46px; flex: 0 0 46px; font-size: 22px; border-radius: 13px;}
#mnav{display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; background: #161d2d; border-top: 1px solid var(--line); padding: 5px 4px calc(5px + env(safe-area-inset-bottom)) 4px;}
#mnav .mb{flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; color: var(--mut); font-size: 10.5px; font-weight: 600; background: none; border: none; cursor: pointer;}
.navi a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.step:focus-visible,.kpi:focus-visible{outline: 2px solid var(--acc); outline-offset: 2px;}
.kpi[data-go2],.step[data-go3]{transition: border-color .15s, background .15s;}
#mnav .mb .mi{font-size: 17px; line-height: 1;}
#mnav .mb.on{color: #fff; background: #1d3054;}
#mnav .mb .dot{position: absolute; margin: -3px 0 0 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad);}
.row,.row3{grid-template-columns: 1fr;}
.curline{grid-template-columns: 1fr 1fr; gap: 6px;}
.slot{min-height: 48px; padding: 4px 5px;}
.slot b{font-size: 11px;} .slot small{font-size: 9.5px;}
.tt th.dh{min-width: 52px; font-size: 10px;}
}
@media(max-width: 520px){
.kpis{grid-template-columns: 1fr 1fr; gap: 9px;}
.kpi .v{font-size: 21px;}
.kpi{padding: 11px;}
.card{padding: 13px;}
.topline h1{font-size: 18px;}
.hero .acts{width: 100%;}
}
</style>
</head>
<body>

<div id="login"><div class="box">
  <div class="logo">&#128197;</div>
  <h1>Smart School Timetable</h1>
  <p class="sub" id="loginSub">Sign in to continue</p>
  <div class="card">
    <div id="loginErr"></div>
    <label class="f" id="wrapName" style="display:none"><span>Your name</span><input id="inName" placeholder="e.g. Principal Sara"></label>
    <label class="f"><span>Username</span><input id="inUser" placeholder="username" autocomplete="username"></label>
    <label class="f"><span>Password</span><input id="inPass" type="password" placeholder="password" autocomplete="current-password"></label>
    <label class="f" id="wrapKey" style="display:none"><span>Setup key</span><input id="inKey" placeholder="from the bot owner"></label>
    <button class="primary" style="width:100%;justify-content:center" id="btnAuth">Sign in</button>
    <div style="text-align:center;margin-top:10px" id="authSwap"></div>
    <div style="margin-top:14px;border-top:1px solid #2a3548;padding-top:12px">
      <button class="sm ghost" id="btnAdv" style="width:100%;justify-content:center">Advanced: API endpoint</button>
      <div id="advBox" style="display:none;margin-top:10px">
        <label class="f"><span>API endpoint URL</span><input id="inApi" placeholder="https://..."></label>
        <button class="sm" id="btnApiSave">Save endpoint</button>
      </div>
    </div>
  </div>
  <p class="muted" style="text-align:center;font-size:12px">All data is stored in your Telegram bot's database.</p>
</div></div>
<div id="app" style="display:none">
  <aside id="side">
    <div class="brand"><div class="logo">&#128197;</div><div><b id="brandName">My School</b><small id="brandUser">signed in</small></div></div>
    <nav class="navi" id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<nav id="mnav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="splash"><div class="spinner"></div><div>Working...</div></div>

<script>
var API = localStorage.getItem("tt_api") || "https://api.telebotcreator.com/new-webhook?data=gAAAAABq48dAu458RBeAoxQoDRX4z4KVi5suRqocA68ulB97pe0bRSkd49NbRUy8L4SNmgdPZNi9vR-fVq_xIXjWrwUajojcDIUXLc5oXq5hy47UmNPnifQ6jSq9y3syzelmQWaQtKRBGvdenBkwM1_cR4eHLKotUTC6tbUDPRqh8LIxt8TWLu7eBr-gc4aYDNFautCi_QBV";
var TOKEN = localStorage.getItem("tt_token") || "";
var S = {school: {name: "", days: [], periods: []}, teachers: [], subjects: [], rooms: [], classes: [], sections: [], curriculum: {}, timetables: {}, admins: [], me: null, conflicts: []};
var VIEW = "dash";

function $(id){ return document.getElementById(id); }
function esc(v){
  if (v === null || v === undefined) { return ""; }
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toast(m, kind){
  var t = $("toast");
  t.className = "on" + (kind ? " " + kind : "");
  t.textContent = m;
  setTimeout(function(){ t.className = ""; }, 3800);
}
function api(action, extra){
  var payload = {action: action, token: TOKEN};
  if (extra) { for (var k in extra) { payload[k] = extra[k]; } }
  return fetch(API, {method: "POST", headers: {"Content-Type": "text/plain;charset=UTF-8"}, body: JSON.stringify(payload)})
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var d = null;
      try { d = JSON.parse(txt); } catch (e) { d = null; }
      if (!d) { throw new Error("The API did not return JSON. Check the endpoint URL. " + txt.slice(0, 120)); }
      if (d.ok === false) { throw new Error(d.error || "Request failed"); }
      return d;
    }).catch(function(e){
      if (e && (e.message === "Failed to fetch" || e.name === "TypeError")) {
        throw new Error("Could not reach the API. Usually the page and the API are on different hosts and the browser blocked the call (CORS). Check the endpoint under Advanced: API endpoint, or send /api to the bot for the right link.");
      }
      throw e;
    });
}
function tById(list, id){
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) { return list[i]; } }
  return null;
}
function nameOf(list, id){ var r = tById(list, id); return r ? (r.name || r.code || "") : ""; }
function isWrite(){ return S.me && (S.me.role === "owner" || S.me.role === "admin"); }
function isOwner(){ return S.me && S.me.role === "owner"; }
function splash(on){
  var el = $("splash");
  if (!el) { return; }
  el.className = on ? "on" : "";
}
function logoSVG(size){
  var sc = (S.school || {});
  var em = sc.logo_emoji || "\uD83D\uDCC5";
  if (sc.logo_img) {
    return "<div class='logo" + (size === "big" ? " big" : "") + "'><img src='" + esc(sc.logo_img) + "' alt='School logo'></div>";
  }
  return "<div class='logo" + (size === "big" ? " big" : "") + "'>" + esc(em) + "</div>";
}
function greeting(){
  var hh = new Date().getHours();
  if (hh < 12) { return "Good morning"; }
  if (hh < 18) { return "Good afternoon"; }
  return "Good evening";
}
function refresh(){
  return api("state").then(function(d){
    S.school = d.school || S.school;
    S.teachers = d.teachers || [];
    S.subjects = d.subjects || [];
    S.rooms = d.rooms || [];
    S.classes = d.classes || [];
    S.sections = d.sections || [];
    S.curriculum = d.curriculum || {};
    S.timetables = d.timetables || {};
    S.admins = d.admins || [];
    S.me = d.me || S.me;
    S.conflicts = d.conflicts || [];
    var bn = $("brandName");
    if (bn && bn.parentNode && bn.parentNode.parentNode) {
      var brandBox = bn.parentNode.parentNode;
      var sig = String((S.school || {}).logo_img || "") + String((S.school || {}).logo_emoji || "");
      if (brandBox.getAttribute("data-logo") !== sig) {
        brandBox.setAttribute("data-logo", sig);
        var oldLogo = brandBox.querySelector(".logo");
        if (oldLogo) { oldLogo.outerHTML = logoSVG(""); }
      }
    }
    $("brandName").textContent = S.school.name || "My School";
    $("brandUser").textContent = (S.me ? S.me.name : "") + " - " + (S.me ? S.me.role : "");
    return d;
  });
}
function fail(e){ toast(e.message || String(e), "err"); }

function showLogin(setup){
  $("login").style.display = "flex";
  $("app").style.display = "none";
  $("wrapName").style.display = setup ? "block" : "none";
  $("wrapKey").style.display = setup ? "block" : "none";
  $("loginSub").textContent = setup ? "Create the first administrator" : "Sign in to continue";
  $("btnAuth").textContent = setup ? "Create administrator" : "Sign in";
  $("authSwap").innerHTML = "<button class='sm ghost' id='btnSwap'>" + (setup ? "I already have an account" : "First time? Create administrator") + "</button>";
  $("btnSwap").onclick = function(){ showLogin(!setup); };
  $("inApi").value = API || "";
  $("btnAuth").onclick = function(){
    var u = $("inUser").value.trim();
    var p = $("inPass").value;
    $("loginErr").innerHTML = "";
    if (!u || !p) { $("loginErr").innerHTML = "<div class='errbox'>Enter a username and password.</div>"; return; }
    if (p.length < 6) { $("loginErr").innerHTML = "<div class='errbox'>The password must be at least 6 characters.</div>"; return; }
    
    var extra = {username: u, password: p};
    if (setup) { extra.name = $("inName").value.trim() || u; extra.setup_key = $("inKey").value.trim(); }
    $("btnAuth").disabled = true;
    api(setup ? "setup" : "login", extra).then(function(d){
      $("btnAuth").disabled = false;
      TOKEN = d.token;
      localStorage.setItem("tt_token", TOKEN);
      $("login").style.display = "none";
      $("app").style.display = "flex";
      return refresh().then(function(){ go("dash"); });
    }).catch(function(e){
      $("btnAuth").disabled = false;
      $("loginErr").innerHTML = "<div class='errbox'>" + esc(e.message) + "</div>";
    });
  };
}
function boot(){
  if (!API) { showLogin(false); return; }
  api("session").then(function(d){
    var setupDone = d.setup_done !== false;
    if (d.admin) {
      $("login").style.display = "none";
      $("app").style.display = "flex";
      return refresh().then(function(){ go("dash"); });
    }
    if (TOKEN) {
      TOKEN = "";
      localStorage.removeItem("tt_token");
    }
    showLogin(!setupDone);
  }).catch(function(e){
    fail(e);
    showLogin(false);
  });
}
function logout(){
  api("logout").catch(function(){}).then(function(){
    TOKEN = "";
    localStorage.removeItem("tt_token");
    S.me = null;
    showLogin(false);
  });
}


var NAV = [
  {id: "dash", ic: "\u25A6", label: "Dashboard"},
  {id: "teachers", ic: "\u263A", label: "Teachers"},
  {id: "classes", ic: "\u25A4", label: "Classes"},
  {id: "subjects", ic: "\u2687", label: "Subjects"},
  {id: "rooms", ic: "\u25A3", label: "Classrooms"},
  {id: "periods", ic: "\u23F0", label: "Periods"},
  {id: "curriculum", ic: "\u270E", label: "Curriculum"},
  {id: "generate", ic: "\u2692", label: "Generate Timetable"},
  {id: "timetable", ic: "\u25A6", label: "View Timetable"},
  {id: "export", ic: "\u2913", label: "Export"},
  {id: "school", ic: "\u2691", label: "Settings"}
];

function fieldHTML(f, val){
  var v = (val === undefined || val === null) ? "" : val;

    var src = S[f.src] || [];
    var chosen = Array.isArray(v) ? v : [];
    var h = "<div class='f'><span style='display:block;font-size:12px;color:#93a1bb;margin-bottom:5px;font-weight:600'>" + esc(f.l) + "</span>";

    for (var i = 0; i < src.length; i++) {
      var on = chosen.indexOf(src[i].id) >= 0 ? " checked" : "";

  if (f.t === "select") {
    var opts = "<option value=''>- none -</option>";

function readForm(){
  var out = {};

  for (var i = 0; i < ins.length; i++) { out[ins[i].getAttribute("data-f")] = ins[i].value; }
  var ms = $("mBody").querySelectorAll("[data-multi]");
  for (var j = 0; j < ms.length; j++) {
    var k = ms[j].getAttribute("data-multi");
    if (!out[k]) { out[k] = []; }
    if (ms[j].checked) { out[k].push(ms[j].value); }
  }
  return out;
}

    filled = filled + n;

function badTime(v){
  if (v === "") { return false; }
  if (!/^[0-9]{1,2}:[0-9]{2}$/.test(v)) { return true; }
  var parts = v.split(":");
  var hh = parseInt(parts[0], 10);
  var mm = parseInt(parts[1], 10);
  return hh > 23 || mm > 59;
}

  $("btnGen").onclick = function(){
    var ids = chosenSections();
    if (ids.length === 0) { toast("Choose at least one class.", "err"); return; }
    $("btnGen").disabled = true;
    $("genOut").innerHTML = "<div class='card'><div class='empty'>Generating...</div></div>";
    api("timetable.generate", {section_ids: ids, options: {assign_rooms: $("optRooms").checked, keep_existing: $("optKeep").checked}})
      .then(function(d){
        $("btnGen").disabled = false;
        var rep = d.report || [];
        var placed = 0;
        var total = 0;
        var unplaced = 0;
        for (var i = 0; i < rep.length; i++) {
          placed = placed + rep[i].placed;
          total = total + rep[i].total;
          unplaced = unplaced + (rep[i].unplaced || []).length;
        }
        var out = "<div class='card'><h2>Result</h2><div class='kpis'>";
        out = out + "<div class='kpi ok'><div class='v'>" + placed + "</div><div class='l'>periods placed</div></div>";
        out = out + "<div class='kpi'><div class='v'>" + total + "</div><div class='l'>periods needed</div></div>";
        out = out + "<div class='kpi " + (unplaced > 0 ? "bad" : "ok") + "'><div class='v'>" + unplaced + "</div><div class='l'>could not be placed</div></div>";
        out = out + "</div>";
        for (var j = 0; j < rep.length; j++) {
          var r = rep[j];
          var nm = sectionName(r.section_id);
          if (r.note) { out = out + "<div class='warnbox'>" + esc(nm) + ": " + esc(r.note) + "</div>"; }
          if ((r.unplaced || []).length > 0) {
            var subs = [];
            for (var k = 0; k < r.unplaced.length; k++) { subs.push(nameOf(S.subjects, r.unplaced[k].subject_id)); }
            out = out + "<div class='warnbox'>" + esc(nm) + ": " + esc(subs.join(", ")) + " could not be placed (no free slot with the teacher and room free).</div>";
          }
        }
        if (unplaced === 0 && total > 0) { out = out + "<div class='note'>Every requested period was placed without breaking a rule.</div>"; }
        out = out + "<div style='margin-top:10px'><button class='primary' id='btnGenGo'>Open the timetable</button></div></div>";
        $("genOut").innerHTML = out;
        $("btnGenGo").onclick = function(){ go("timetable"); };
        refresh().then(function(){});
      }).catch(function(e){ $("btnGen").disabled = false; $("genOut").innerHTML = ""; fail(e); });
  };
  $("btnClear").onclick = function(){
    var ids = chosenSections();
    if (ids.length === 0) { toast("Choose at least one class.", "err"); return; }
    modal("Clear timetables", "<div class='errbox'>Remove every period from " + ids.length + " section(s)?</div>", function(done){
      api("timetable.clear", {section_ids: ids}).then(function(){
        closeModal(); toast("Cleared", "ok");
        refresh().then(function(){ go("generate"); });
      }).catch(function(e){ done(); fail(e); });
    }, "Clear");
  };
}
function chosenSections(){
  var ids = [];
  var cs = $("main").querySelectorAll("[data-gen-class]");
  for (var i = 0; i < cs.length; i++) {
    if (!cs[i].checked) { continue; }
    var cid = cs[i].getAttribute("data-gen-class");
    for (var j = 0; j < S.sections.length; j++) { if (S.sections[j].class_id === cid) { ids.push(S.sections[j].id); } }
  }
  return ids;
}
function sectionName(sid){
  var s = tById(S.sections, sid);
  if (!s) { return "Section"; }
  var c = tById(S.classes, s.class_id);
  return (c ? c.name : "Class") + " - " + s.name;
}
function ttView(){
  if ((S.classes || []).length === 0) {
    $("main").innerHTML = head("Timetable", "") + "<div class='card'><div class='empty'>Add a class and a section first.</div></div>";
    return;
  }
  if (!TT_SECTION || !tById(S.sections, TT_SECTION)) {
    if ((S.sections || []).length > 0) { TT_SECTION = S.sections[0].id; }
  }
  var h = head("Timetable", "Tap a period to add, change or clear it",
    isWrite() ? "<button class='sm ghost' id='btnTtGen'>Generate</button>" : "");
  h = h + "<div class='card'><div class='row'><label class='f'><span>Section</span><select id='ttSec'>";
  for (var j = 0; j < (S.sections || []).length; j++) {
    var sec = S.sections[j];
    h = h + "<option value='" + esc(sec.id) + "'" + (sec.id === TT_SECTION ? " selected" : "") + ">" + esc(sectionName(sec.id)) + "</option>";
  }
  h = h + "</select></label>";
  h = h + "<label class='f'><span>View</span><select id='ttMode'><option value='sec'>This section</option><option value='teacher'>By teacher</option><option value='room'>By classroom</option></select></label></div></div>";
  h = h + "<div class='card' id='gridCard'></div>";
  $("main").innerHTML = h;
  $("ttSec").onchange = function(){ TT_SECTION = this.value; go("timetable"); };
  $("ttMode").onchange = function(){ TT_MODE = this.value; go("timetable"); };
  if ($("btnTtGen")) { $("btnTtGen").onclick = function(){ go("generate"); }; }
  drawGrid();
}
var TT_MODE = "sec";
function cellKey(d, p){ return d + "-" + p; }
function drawGrid(){
  var days = S.school.days || [];
  var periods = S.school.periods || [];
  var table = {};
  var title = "";
  if (TT_MODE === "sec") {
    table = S.timetables[TT_SECTION] || {};
    title = sectionName(TT_SECTION);
  } else {
    var target = TT_MODE === "teacher" ? (TT_TEACHER || ((S.teachers || [])[0] || {}).id) : (TT_ROOM || ((S.rooms || [])[0] || {}).id);
    for (var sid in S.timetables) {
      var t = S.timetables[sid];
      for (var k in t) {
        var sl = t[k] || {};
        var match = TT_MODE === "teacher" ? (sl.teacher_id === target) : (sl.room_id === target);
        if (match) { table[k] = {subject_id: sl.subject_id, teacher_id: sl.teacher_id, room_id: target, sec: sid}; }
      }
    }
    title = TT_MODE === "teacher" ? ("Teacher: " + nameOf(S.teachers, target)) : ("Room: " + nameOf(S.rooms, target));
  }
  var h = "<h2>" + esc(title) + "</h2>";
  if (TT_MODE !== "sec") {
    h = h + "<label class='f'><span>Choose</span><select id='ttPick'>";
    var list = TT_MODE === "teacher" ? (S.teachers || []) : (S.rooms || []);
    var cur = TT_MODE === "teacher" ? TT_TEACHER : TT_ROOM;
    for (var i = 0; i < list.length; i++) {
      h = h + "<option value='" + esc(list[i].id) + "'" + (list[i].id === cur ? " selected" : "") + ">" + esc(list[i].name) + "</option>";
    }
    h = h + "</select></label>";
  }
  h = h + "<div class='tblwrap'><table class='tt'><thead><tr><th class='dh'>Day</th>";
  for (var p = 0; p < periods.length; p++) { h = h + "<th>" + esc(periods[p].name) + "</th>"; }
  h = h + "</tr></thead><tbody>";
  for (var d = 0; d < days.length; d++) {
    h = h + "<tr><th class='dh'>" + esc(days[d]) + "</th>";
    for (var q = 0; q < periods.length; q++) {
      var key = cellKey(d, q);
      var cell = table[key] || {};
      var cls = cell.subject_id ? "slot full" : "slot";
      h = h + "<td><div class='" + cls + "' data-cell='" + key + "'>";
      if (cell.subject_id) {
        h = h + "<b>" + esc(nameOf(S.subjects, cell.subject_id)) + "</b>";
        var sub = "";
        if (cell.teacher_id) { sub = nameOf(S.teachers, cell.teacher_id); }
        if (cell.room_id) { sub = sub + (sub ? " - " : "") + nameOf(S.rooms, cell.room_id); }
        if (TT_MODE !== "sec" && cell.sec) { sub = sectionName(cell.sec); }
        h = h + "<small>" + esc(sub) + "</small>";
      } else {
        h = h + "<div class='plus'>+</div>";
      }
      h = h + "</div></td>";
    }
    h = h + "</tr>";
  }
  h = h + "</tbody></table></div>";
  h = h + "<div class='legend'><span><span class='pill ok'>filled</span> lesson placed</span><span>Tap any cell to edit it</span></div>";
  $("gridCard").innerHTML = h;
  if ($("ttPick")) {
    $("ttPick").onchange = function(){
      if (TT_MODE === "teacher") { TT_TEACHER = this.value; } else { TT_ROOM = this.value; }
      drawGrid();
    };
  }
  var cells = $("gridCard").querySelectorAll("[data-cell]");
  for (var c = 0; c < cells.length; c++) {
    cells[c].onclick = function(){
      var parts = this.getAttribute("data-cell").split("-");
      openSlot(parseInt(parts[0], 10), parseInt(parts[1], 10));
    };
  }
}
var TT_TEACHER = "";
var TT_ROOM = "";
function openSlot(d, p){
  var table = S.timetables[TT_SECTION] || {};
  var cur = table[cellKey(d, p)] || {};
  var rd = isWrite() ? "" : " disabled";
  var h = "<div class='muted' style='margin-bottom:12px'>" + esc((S.school.days || [])[d]) + " - " + esc((S.school.periods || [])[p].name) + " - " + esc(sectionName(TT_SECTION)) + "</div>";
  h = h + "<label class='f'><span>Subject</span><select id='slSub'" + rd + "><option value=''>- free period -</option>" + optionsFor(S.subjects, cur.subject_id || "") + "</select></label>";
  h = h + "<label class='f'><span>Teacher</span><select id='slTch'" + rd + "><option value=''>- none -</option>" + optionsFor(S.teachers, cur.teacher_id || "") + "</select></label>";
  h = h + "<label class='f'><span>Classroom</span><select id='slRoom'" + rd + "><option value=''>- none -</option>" + optionsFor(S.rooms, cur.room_id || "") + "</select></label>";
  h = h + "<div id='slWarn'></div>";
  if (!isWrite()) {
    modal("This period", h, function(){ closeModal(); }, "Close");
    return;
  }
  modal("Edit period", h, function(done){
    var sid = $("slSub").value;
    var extra = {section_id: TT_SECTION, day: d, period: p, subject_id: sid, teacher_id: $("slTch").value, room_id: $("slRoom").value};
    api("slot.set", extra).then(function(res){
      var w = res.warnings || [];
      closeModal();
      if (sid === "") { toast("Period cleared", "ok"); }
      else if (w.length > 0) { toast(w[0], "err"); }
      else { toast("Saved", "ok"); }
      refresh().then(function(){ go("timetable"); });
    }).catch(function(e){ done(); fail(e); });
  });
}
function confView(){
  var h = tabsHTML("conf") + head("Conflicts", "Teacher and classroom clashes across all sections");
  if (S.conflicts.length === 0) {
    h = h + "<div class='card'><div class='kpi ok'><div class='v'>0</div><div class='l'>No conflicts found</div></div></div>";
  } else {
    h = h + "<div class='card'><h2>" + S.conflicts.length + " finding(s)</h2><div class='tblwrap'><table><thead><tr><th>Type</th><th>When</th><th>Detail</th></tr></thead><tbody>";
    for (var i = 0; i < S.conflicts.length; i++) {
      var c = S.conflicts[i];
      var parts = String(c.slot).split("-");
      var when = "-";
      if (parts.length === 2) {
        when = ((S.school.days || [])[parseInt(parts[0], 10)] || "?") + " " + (((S.school.periods || [])[parseInt(parts[1], 10)] || {}).name || "?");
      }
      var detail = "";
      if (c.type === "teacher") { detail = nameOf(S.teachers, c.teacher_id) + " in " + sectionName(c.a) + " and " + sectionName(c.b); }
      else if (c.type === "room") { detail = nameOf(S.rooms, c.room_id) + " used by " + sectionName(c.a) + " and " + sectionName(c.b); }
      else if (c.type === "unavailable") { detail = nameOf(S.teachers, c.teacher_id) + " is marked unavailable (" + sectionName(c.a) + ")"; }
      else { detail = nameOf(S.teachers, c.teacher_id) + " is over the daily limit of " + esc(c.b) + " (" + sectionName(c.a) + ")"; }
      h = h + "<tr><td><span class='pill bad'>" + esc(c.type) + "</span></td><td>" + esc(when) + "</td><td>" + esc(detail) + "</td></tr>";
    }
    h = h + "</tbody></table></div></div>";
  }
  $("main").innerHTML = h;
}


function expView(){
  var h = head("Export", "PDF, Excel and CSV files built from the saved timetable");
  h = h + "<div class='card'><h2>Sections to include</h2>";
  h = h + "<label class='chk'><input type='checkbox' id='expAll' checked><span><b>All sections</b></span></label>";
  for (var i = 0; i < (S.sections || []).length; i++) {
    h = h + "<label class='chk'><input type='checkbox' data-exp='" + esc(S.sections[i].id) + "' checked><span>" + esc(sectionName(S.sections[i].id)) + "</span></label>";
  }
  h = h + "<div style='margin-top:12px;display:flex;gap:8px;flex-wrap:wrap'>";
  h = h + "<button class='primary' data-exp-fmt='pdf'>Download PDF</button>";
  h = h + "<button data-exp-fmt='excel'>Download Excel</button>";
  h = h + "<button data-exp-fmt='csv'>Download CSV</button>";
  h = h + "</div><div id='expOut' style='margin-top:12px'></div></div>";
  h = h + "<div class='card'><h2>Email the files instead</h2><div class='muted' style='font-size:13px'>Ask the bot for the files with the command /export and it sends them in Telegram.</div></div>";
  $("main").innerHTML = h;
  $("expAll").onchange = function(){
    var boxes = $("main").querySelectorAll("[data-exp]");
    for (var i = 0; i < boxes.length; i++) { boxes[i].checked = this.checked; }
  };
  var btns = $("main").querySelectorAll("[data-exp-fmt]");
  for (var b = 0; b < btns.length; b++) {
    btns[b].onclick = function(){ doExport(this.getAttribute("data-exp-fmt")); };
  }
}
function doExport(fmt){
  var ids = [];
  var boxes = $("main").querySelectorAll("[data-exp]");
  for (var i = 0; i < boxes.length; i++) { if (boxes[i].checked) { ids.push(boxes[i].getAttribute("data-exp")); } }
  if (ids.length === 0) { toast("Choose at least one section.", "err"); return; }
  $("expOut").innerHTML = "<div class='muted'>Building the file...</div>";
  api("export." + fmt, {section_ids: ids}).then(function(d){
    var content = d.content || "";
    var mime = d.mime || "text/plain";
    if (d.encoding === "base64") {
      var bin = atob(content);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
      saveBlob(new Blob([bytes], {type: mime}), d.filename);
    } else {
      saveBlob(new Blob([content], {type: mime}), d.filename);
    }
    $("expOut").innerHTML = "<div class='note'>Saved " + esc(d.filename) + " (" + Math.round(content.length / 1024) + " KB). Check your downloads.</div>";
  }).catch(function(e){ $("expOut").innerHTML = ""; fail(e); });
}
function saveBlob(blob, filename){
  if (window.navigator && window.navigator.msSaveOrOpenBlob) {
    window.navigator.msSaveOrOpenBlob(blob, filename);
    return;
  }
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
    try { window.Telegram.WebApp.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  }
}
function admView(){
  var h = tabsHTML("adm") + head("Administrators", "Who can open this Mini App and what they may do",
    isWrite() && isOwner() ? "<button class='primary' id='btnNewAdm'>+ Add administrator</button>" : "");
  h = h + "<div class='card'><div class='note'>Roles: <b>owner</b> can do everything including administrators. <b>admin</b> can edit school data and timetables. <b>viewer</b> can only look and export.</div>";
  h = h + "<div class='tblwrap'><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr></thead><tbody>";
  for (var i = 0; i < (S.admins || []).length; i++) {
    var a = S.admins[i];
    h = h + "<tr><td><b>" + esc(a.name) + "</b></td><td class='muted'>" + esc(a.username) + "</td><td><span class='pill " + esc(a.role) + "'>" + esc(a.role) + "</span></td><td style='text-align:right'>";
    if (isOwner()) {
      h = h + "<button class='sm' data-adm-role='" + esc(a.id) + "'>Role</button> <button class='sm' data-adm-pw='" + esc(a.id) + "'>Password</button>";
      if (a.id !== (S.me || {}).id) { h = h + " <button class='sm bad' data-adm-del='" + esc(a.id) + "'>Delete</button>"; }
    }
    h = h + "</td></tr>";
  }
  h = h + "</tbody></table></div></div>";
  $("main").innerHTML = h;
  if ($("btnNewAdm")) {
    $("btnNewAdm").onclick = function(){
      var body = "<label class='f'><span>Name</span><input id='adName'></label><label class='f'><span>Username</span><input id='adUser'></label><label class='f'><span>Password (6+ characters)</span><input id='adPass' type='password'></label><label class='f'><span>Role</span><select id='adRole'><option value='viewer'>viewer</option><option value='admin'>admin</option><option value='owner'>owner</option></select></label>";
      modal("New administrator", body, function(done){
        api("admin.create", {username: $("adUser").value.trim(), password: $("adPass").value, name: $("adName").value.trim(), role: $("adRole").value}).then(function(){
          closeModal(); toast("Administrator added", "ok");
          refresh().then(function(){ go("admins"); });
        }).catch(function(e){ done(); fail(e); });
      });
    };
  }
  var rs = $("main").querySelectorAll("[data-adm-role]");
  for (var r = 0; r < rs.length; r++) {
    rs[r].onclick = function(){
      var id = this.getAttribute("data-adm-role");
      var a = tById(S.admins, id);
      var body = "<label class='f'><span>Role</span><select id='rlRole'><option value='viewer'" + (a.role === "viewer" ? " selected" : "") + ">viewer</option><option value='admin'" + (a.role === "admin" ? " selected" : "") + ">admin</option><option value='owner'" + (a.role === "owner" ? " selected" : "") + ">owner</option></select></label>";
      modal("Role of " + a.name, body, function(done){
        api("admin.update", {id: id, role: $("rlRole").value}).then(function(){
          closeModal(); toast("Role changed", "ok");
          refresh().then(function(){ go("admins"); });
        }).catch(function(e){ done(); fail(e); });
      });
    };
  }
  var ps = $("main").querySelectorAll("[data-adm-pw]");
  for (var p = 0; p < ps.length; p++) {
    ps[p].onclick = function(){
      var id = this.getAttribute("data-adm-pw");
      modal("Set a new password", "<label class='f'><span>New password (6+ characters)</span><input id='pwNew' type='password'></label>", function(done){
        api("admin.update", {id: id, password: $("pwNew").value}).then(function(){
          closeModal(); toast("Password changed - that user must sign in again", "ok");
          refresh().then(function(){ go("admins"); });
        }).catch(function(e){ done(); fail(e); });
      });
    };
  }
  var ds = $("main").querySelectorAll("[data-adm-del]");
  for (var d = 0; d < ds.length; d++) {
    ds[d].onclick = function(){
      var id = this.getAttribute("data-adm-del");
      modal("Delete administrator", "<div class='errbox'>This account can no longer open the app.</div>", function(done){
        api("admin.delete", {id: id}).then(function(){
          closeModal(); toast("Deleted", "ok");
          refresh().then(function(){ go("admins"); });
        }).catch(function(e){ done(); fail(e); });
      }, "Delete");
    };
  }
}
document.addEventListener("DOMContentLoaded", function(){
  $("btnAdv").onclick = function(){
    var b = $("advBox");
    b.style.display = b.style.display === "none" ? "block" : "none";
  };
  $("btnApiSave").onclick = function(){
    API = $("inApi").value.trim();
    localStorage.setItem("tt_api", API);
    toast("Endpoint saved", "ok");
    boot();
  };
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor("#0f1420");
    } catch (e) {}
  }
  boot();
});
</script>
